name: Validar extensões

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Checar sintaxe das extensões
        run: |
          for file in extensions/*.js; do
            node --check "$file"
          done

      - name: Validar índice e hashes
        run: node scripts/generate-index.js --check
